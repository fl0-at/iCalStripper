<!DOCTYPE html>
<html lang="en">
<head>
    <title>iCalStripper</title>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <link rel="stylesheet" href="./css/styles.css">
    
    <script defer src="./datepicker.js"></script>
    <script defer src="./renderer.js"></script>
</head>
<body>
    <div class="header">
        <section class="section" id="headline">
            <div class="container">
                <h1 class="title">
                    iCal Stripper
                </h1>
            </div>
        </section>
    </div>
    <div class="content" id="container">
        <section class="section" id="beforeDrop">
            <div class="container">
                <div id="dropzone">
                    <section class="section">
                        <div class="container" id="dropzonetext">
                            Drag an iCal file here...
                        </div>
                    </section>
                </div>
            </div>
        </section>
        <section class="section" id="afterDrop">
            <div class="container">
                <form id="stripParams">
                    <table>
                        <tr>
                            <td colspan="4"><label for="dateRangePicker" id="descText">Enter the daterange you want to keep from the iCal File</label></td>
                        </tr>
                        <tr>
                            <td class="label">
                                <label for="dateRangePicker">Date Range</label>
                            </td>
                            <td class="datepicker">
                                <input name="dateRange"
                                       type="text"
                                       id="dateRangePicker"
                                       class="datepicker"
                                       readonly
                                       required
                                />
                            </td>
                        </tr>
                        <tr>
                            <td class="submit" colspan="4">
                                <input name="Submit"
                                       type="submit"
                                       id="submit"
                                       class="button"
                                       value="strip!"
                                       disabled />
                            </td>
                        </tr>
                    </table>
                </form>
            </div>
        </section>
    </div>

    <footer class="footer">
        <div class="content has-text-centered">
            <div class="footer">
                iCalStripper is built with <span class="icon">&#10084;</span> using the following components: <!--&#xfe0f; for unicode variation selector 16 => emoji! -->
                <div class="list">
                    <span class="icon">&#11041;</span> Node.js <span id="node-version"></span><br>
                    <span class="icon">&#127760;</span> Chromium <span id="chrome-version"></span><br>
                    <span class="icon">&#9883;</span> Electron <span id="electron-version"></span>
                </div>
            </div>
        </div>
    </footer>

    <div class="bg-modal">
        <div class="modal-content" id="openSaveLocationPopup" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="infotext path">
            <h2 id="modalTitle">Your calendar is ready</h2>
            <div class="modal-text" id="infotext">Your file has been saved under the following location:</div>
            <div class="modal-text" id="path">$path</div>
            <div class="modal-text" id="question">How would you like to proceed?</div>
            <div id="openSaveLocation" class="modal-actions">
                <button type="button" id="yes" class="button button-primary">Open file location & restart</button>
                <button type="button" id="both" class="button button-secondary">Open file location & quit</button>
                <button type="button" id="no" class="button button-quiet">Quit now</button>
            </div>
        </div>        
    </div>
</body>

</html>
